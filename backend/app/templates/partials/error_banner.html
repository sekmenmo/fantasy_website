<section class="error-banner">
  <strong>{{ message or warning or error or "Something went wrong." }}</strong>
  {% if last_updated %}
    <span>Last cached update: {{ last_updated }}</span>
  {% endif %}
  {% if week %}
    <button
      type="button"
      hx-post="/matchups/refresh?week={{ week }}"
      hx-target="#matchup-page-shell"
      hx-swap="innerHTML">Retry</button>
  {% endif %}
</section>
