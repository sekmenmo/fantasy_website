<section class="error-banner">
  <strong>{{ message or warning or error or "Something went wrong." }}</strong>
  {% if last_updated %}
    <span>Last cached update: {{ last_updated }}</span>
  {% endif %}
  {% if week %}
    <button
      type="button"
      hx-post="/matchups/refresh?week={{ week }}{% if matchup %}&matchup={{ matchup }}{% endif %}"
      hx-target="{{ retry_target or '#matchup-panel-shell' }}"
      hx-swap="innerHTML"
      hx-disabled-elt="this"
      hx-sync="this:drop">Retry</button>
  {% endif %}
</section>
