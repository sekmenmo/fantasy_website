<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Fantasy Broadcast Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
    <script src="{{ url_for('static', path='/js/htmx.min.js') }}" defer></script>
    <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <nav class="top-nav" aria-label="Primary">
        <a class="brand" href="/matchups">Football Sunday</a>
        <div class="nav-links">
          <a class="{{ 'active' if active_page == 'matchups' else '' }}" href="/matchups">Matchups</a>
          <a class="{{ 'active' if active_page == 'standings' else '' }}" href="/standings">Standings</a>
          <a class="{{ 'active' if active_page == 'rankings' else '' }}" href="/power-rankings">Power Rankings</a>
        </div>
      </nav>
      {% block content %}{% endblock %}
    </div>
  </body>
</html>
